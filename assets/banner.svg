  <text x="294" y="212" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" fill="#9fb2d0">Deterministic guardrails for AI agents.</text>
  <text x="294" y="252" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="18" fill="#6f84a8">policy-as-code · enforced at the tool boundary · proven by a rerunnable attack suite</text>

