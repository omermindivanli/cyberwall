[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cyberwall"
version = "0.1.0a0"
description = "Deterministic local-first policy guard for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Cyberwall contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pydantic==2.14.2",
    "pyyaml==6.0.3",
]

[project.urls]
Homepage = "https://github.com/omermindivanli/cyberwall"
Repository = "https://github.com/omermindivanli/cyberwall"
Issues = "https://github.com/omermindivanli/cyberwall/issues"

[project.scripts]
cyberwall = "cyberwall.cli:main"

[dependency-groups]
dev = [
  "coverage==7.6.10",
  "hypothesis==6.122.3",
  "import-linter==2.1",
  # Validates that the published JSON Schema matches policy model acceptance.
  "jsonschema==4.26.0",
  "mypy==1.14.1",
  "pre-commit==4.0.1",
  "pytest==8.3.4",
  "ruff==0.8.4",
  "types-pyyaml==6.0.12.20241230",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cyberwall"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/cyberwall/core"]

[tool.coverage.run]
branch = true
source = ["cyberwall"]
